<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Review 5 - 5학년 영어 복습</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #4facfe 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .container { max-width: 900px; width: 100%; }
    h1 { font-size: 3rem; margin-bottom: 12px; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
    .subtitle { font-size: 1.2rem; opacity: 0.9; margin-bottom: 32px; }
    .start-btn {
      background: white;
      color: #764ba2;
      border: none;
      padding: 16px 40px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      transition: transform 0.2s;
      margin-bottom: 48px;
    }
    .start-btn:hover { transform: translateY(-3px); }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; }
    .card {
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 28px 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      transition: transform 0.2s;
      cursor: pointer;
    }
    .card:hover { transform: translateY(-5px); }
    .card .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .card h3 { font-size: 1.2rem; margin-bottom: 6px; }
    .card p { font-size: 0.9rem; opacity: 0.85; }
  </style>
</head>
<body>
  <div class="container">
    <h1>English Review 5 🎓</h1>
    <p class="subtitle">재미있게 배우는 5학년 영어 복습 ✨</p>
    <button class="start-btn" onclick="alert('학습을 시작합니다!')">시작하기 🚀</button>
    <div class="cards">
      <div class="card"><div class="icon">🎧</div><h3>듣기</h3><p>단어와 문장 듣기</p></div>
      <div class="card"><div class="icon">🗣️</div><h3>말하기</h3><p>따라 말하기 연습</p></div>
      <div class="card"><div class="icon">📖</div><h3>읽기</h3><p>문장 읽고 이해하기</p></div>
      <div class="card"><div class="icon">✏️</div><h3>쓰기</h3><p>단어와 문장 쓰기</p></div>
    </div>
  </div>
</body>
</html>
